name: Build SnapchatReloaded

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout SnapchatReloaded
        uses: actions/checkout@v4

      - name: Download theos-jailed
        run: |
          git clone https://github.com/BishopFox/theos-jailed.git theos

      - name: Patch old Theos Perl code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("theos/bin/lib/aliased.pm")
          text = p.read_text()

          old = "sub () { $package }"
          new = "sub { $package }"

          if old not in text:
              print("ERROR: Expected code was not found")
              raise SystemExit(1)

          text = text.replace(old, new)
          p.write_text(text)

          print("Patch successful!")
          PY

          echo "===== Patched line ====="
          nl -ba theos/bin/lib/aliased.pm | sed -n '38,45p'

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git theos-sdks
          mkdir -p theos/sdks
          cp -R theos-sdks/iPhoneOS16.5.sdk theos/sdks/

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Build SnapchatReloaded
        run: |
          make clean
          make package SDKVERSION=16.5

      - name: Show generated files
        if: always()
        run: |
          find . -type f | sort

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnapchatReloaded-Build
          path: |
            packages/
            obj/

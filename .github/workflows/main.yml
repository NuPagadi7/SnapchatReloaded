name: Diagnose SnapchatReloaded

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout SnapchatReloaded
        uses: actions/checkout@v4

      - name: Download theos-jailed
        run: |
          git clone https://github.com/BishopFox/theos-jailed.git theos

      - name: Show problematic Perl code
        run: |
          echo "===== aliased.pm lines 30-55 ====="
          nl -ba theos/bin/lib/aliased.pm | sed -n '30,55p'

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git theos-sdks
          mkdir -p theos/sdks
          cp -R theos-sdks/iPhoneOS16.5.sdk theos/sdks/

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Build SnapchatReloaded
        run: |
          make clean
          make package SDKVERSION=16.5

      - name: Show generated files
        if: always()
        run: |
          find . -type f | sort

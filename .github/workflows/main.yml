name: Build SnapchatReloaded

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout SnapchatReloaded
        uses: actions/checkout@v4

      - name: Download theos-jailed
        run: |
          git clone https://github.com/BishopFox/theos-jailed.git theos

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git theos-sdks
          mkdir -p theos/sdks
          cp -R theos-sdks/iPhoneOS16.5.sdk theos/sdks/

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Patch old Theos Perl code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("theos/bin/lib/aliased.pm")
          text = p.read_text()

          old = "sub () { $alias }"
          new = "sub { $alias }"

          if old not in text:
              print("Expected aliased.pm code not found.")
              print(text)
              raise SystemExit(1)

          p.write_text(text.replace(old, new))
          print("Patched:", p)
          PY

      - name: Build SnapchatReloaded
        run: |
          make clean
          make package SDKVERSION=16.5

      - name: Show generated files
        if: always()
        run: |
          find . -type f | sort

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnapchatReloaded-Build
          path: |
            packages/
            obj/
